<!DOCTYPE html>
<html>
<head>
 <title>Ejemplo de JavaScript</title>
 <meta charset="UTF-8">
</head>
<body>
 <script>
 let valor1;
 let valor2 ;
 valor1 = prompt("Introduce el primer valor:");
 valor2 = prompt("Introduce el segundo valor:");
 let suma = parseInt(valor1) + parseInt(valor2);
 let producto = parseInt(valor1) * parseInt(valor2);
 document.write('La suma es: ');
 document.write(suma);
 document.write('<br>');
 document.write('El producto es: ');
 document.write(producto);
 
 </script>
</body>
</html>
