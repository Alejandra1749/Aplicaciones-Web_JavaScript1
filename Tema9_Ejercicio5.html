<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let sueldo=parseInt(prompt("Introduce tu sueldo:"));
        let antiguedad=parseInt(prompt("Introduce tu antigüedad en años:"));
        if(sueldo<500 && antiguedad>=10){
            let aumento=sueldo*0.20;
            let sueldonuevo=sueldo+aumento;
            document.write('Tu nuevo sueldo es: ' + sueldonuevo);
        }
        else{
            if(sueldo<500 && antiguedad<10){
                let aumento=sueldo*0.05;
                let sueldonuevo=sueldo+aumento;
                document.write('Tu nuevo sueldo es: ' + sueldonuevo);
            }
            else{
                document.write('Tu sueldo es: ' + sueldo);
            }
        }
    </script>
</body>
</html>
