<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=parseInt(prompt("Introduce un número positivo de uno o dos digitos:"));
        if(num>0 && num<100){
            if(num<10){
                document.write("El número " + num + " tiene un dígito");
            }
            else{
                document.write("El número " + num + " tiene dos dígitos");
            }
        }
        else{
            document.write("El número debe ser positivo y de uno o dos dígitos");
        }
    </script>
</body>
</html>
