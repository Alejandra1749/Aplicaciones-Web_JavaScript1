<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x=parseInt(prompt("Ingresa la coordenada de x del plano:"));
        let y=parseInt(prompt("Ingresa la coordenada de y del plano:"));
        if(x>0 && y>0){
            document.write("El punto ("+x+","+y+") se encuentra en el primer cuadrante.");
        }
        else if(x<0 && y>0){
            document.write("El punto ("+x+","+y+") se encuentra en el segundo cuadrante.");
        }
        else if(x<0 && y<0){
            document.write("El punto ("+x+","+y+") se encuentra en el tercer cuadrante.");
        }
        else{
            document.write("El punto ("+x+","+y+") se encuentra en el cuarto cuadrante.");
        }
    </script>
</body>
</html>
