<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = parseInt(prompt("Introduce el primer número:"));
        let num2 = parseInt(prompt("Introduce el segundo número:"));
        let num3 = parseInt(prompt("Introduce el tercer número:"));
        if(num1==num2 && num2==num3 && num1==num3){
            let suma=(num1+num2);
            let producto=(suma*num3);
            document.write("Los tres números son iguales. La suma de los dos primeros es: " + suma + " y el producto por el tercero es: " + producto);
        }
        else{

            document.write("Los números no son iguales.");
        }
    </script>
</body>
</html>
