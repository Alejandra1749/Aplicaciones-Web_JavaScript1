<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1=parseInt(prompt('Ingrese primer número:'));
        let num2=parseInt(prompt('Ingrese segundo número:'));
        let num3=parseInt(prompt('Ingrese tercer número:'));
        if(num1<10 || num2<10 || num3<10){
            document.write('Alguno de los números es menor a 10.');
        }
        else{
            document.write('Ningún número es menor a 10.');
        }
    </script>
</body>
</html>
