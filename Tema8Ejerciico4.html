<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postulante</title>
</head>
<body>
    <script>
        let nombre=prompt("Introduce el nombre del postulante:");
        let preguntas=parseInt(prompt("¿Cuántas preguntas se le realizaron?"));
        let correctas=parseInt(prompt("¿Cuántas respuestas correctas dio?"));
        let porcentaje=parseInt((correctas/preguntas)*100);
        if(porcentaje>=90){
            document.write("El postulante "+ nombre+ " ha respondido correctamente "+ correctas+ " preguntas de un total de "+ preguntas+ " y ha obtenido un porcentaje de "+ porcentaje+ "%. Por lo tanto, su nivel es superior.");

        }
        else{
            if(porcentaje>=75 && porcentaje<90){
                document.write("El postulante "+ nombre+ " ha respondido correctamente "+ correctas+ " preguntas de un total de "+ preguntas+ " y ha obtenido un porcentaje de "+ porcentaje+ "%. Por lo tanto, su nivel es medio.");
            }
            else{
                if(porcentaje>=50 && porcentaje<75){
                    document.write("El postulante "+ nombre+ " ha respondido correctamente "+ correctas+ " preguntas de un total de "+ preguntas+ " y ha obtenido un porcentaje de "+ porcentaje+ "%. Por lo tanto, su nivel es regular.");
                }
                else{
                    document.write("El postulante "+ nombre+ " ha respondido correctamente "+ correctas+ " preguntas de un total de "+ preguntas+ " y ha obtenido un porcentaje de "+ porcentaje+ "%. Por lo tanto, esta fuera de nivel.");
                }
            }
        }
    </script>

</body>
</html>
