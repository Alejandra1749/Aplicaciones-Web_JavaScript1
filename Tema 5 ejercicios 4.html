<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let precio = prompt("Introduce el precio del producto:");
        let cantidad = prompt("Introduce la cantidad que lleva:");
        let total = parseInt(precio) * parseInt(cantidad);
        document.write("El total a pagar es: " + total);
    </script>
</body>
</html>
