<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n1=prompt("Introduce un numero:");
        let n2=prompt("Introduce otro numero:");
        let n3=prompt("Introduce un tercer numero:");
        let n4=prompt("Introduce un cuarto numero:");
        let suma=Number(n1)+Number(n2);
        document.write("La suma de los dos primeros números es: " + suma);
        document.write('<br>');
        let multiplicacion=Number(n3)*Number(n4);
        document.write("La multiplicación de los dos últimos números es: " + multiplicacion);
    </script>
</body>
</html>
