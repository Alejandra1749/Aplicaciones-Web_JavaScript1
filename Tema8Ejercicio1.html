<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numero1 = parseInt(prompt("Introduce el primer número:"));
        let numero2 = parseInt(prompt("Introduce el segundo número:"));
        let numero3 = parseInt(prompt("Introduce el tercer número:"));
        if(numero1>numero2){
            if(numero1>numero3){
                document.write("El número mayor es: " + numero1);
            }
            else{
                document.write("El número mayor es: " + numero3);
            }

        }
        else{
            if(numero2>numero3){
                document.write("El número mayor es: " + numero2);
            }
            else{
                document.write("El número mayor es: " + numero3);
            }
        }
    </script>
</body>
</html>
